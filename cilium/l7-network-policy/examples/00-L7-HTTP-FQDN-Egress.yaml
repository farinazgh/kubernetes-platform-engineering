apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orders-api-l7-and-fqdn
  namespace: prod


spec:
  endpointSelector:
    matchLabels:
      app: orders-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: checkout
            k8s:io.kubernetes.pod.namespace: prod
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "/v1/status"
  egress:
    - toFQDNs:
        - matchName: "api.example-psp.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
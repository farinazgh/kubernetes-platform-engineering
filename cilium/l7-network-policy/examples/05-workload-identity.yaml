apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-billing-by-identity
  namespace: finance
spec:
  endpointSelector:
    matchLabels:
      app: ledger-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: billing-worker
            k8s:io.kubernetes.pod.namespace: finance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
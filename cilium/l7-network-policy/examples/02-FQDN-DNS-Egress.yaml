apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-webhook-egress-fqdn
  namespace: integrations
spec:
  endpointSelector:
    matchLabels:
      app: webhook-dispatcher
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*.partner-webhooks.example.com"
    - toFQDNs:
        - matchPattern: "*.partner-webhooks.example.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
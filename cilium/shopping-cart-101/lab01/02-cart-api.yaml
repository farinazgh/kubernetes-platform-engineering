apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-api-code
  namespace: shopping-cart
data:
  app.py: |
    import json
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ROUTES = {
        ("GET", "/v1/cart"): "Shopping cart retrieved",
        ("POST", "/v1/cart/items"): "Product added to cart",
        ("PUT", "/v1/cart/items"): "Cart items updated",
        ("PUT", "/v1/cart/discount"): "Discount applied",
        ("GET", "/v1/cart/status"): "Cart is operational",
        ("GET", "/v1/healthz"): "Healthy",
    }

    class CartHandler(BaseHTTPRequestHandler):

        def handle_request(self):
            content_length = int(self.headers.get("Content-Length", 0))
            if content_length:
                self.rfile.read(content_length)

            message = ROUTES.get((self.command, self.path))

            response = {
                "service": "cart-api",
                "pod": socket.gethostname(),
                "method": self.command,
                "path": self.path,
                "message": message or "Not found"
            }

            body = json.dumps(response).encode()

            self.send_response(200 if message else 404)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        do_GET = handle_request
        do_POST = handle_request
        do_PUT = handle_request

    ThreadingHTTPServer(("0.0.0.0", 80), CartHandler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: shopping-cart
spec:
  replicas: 3
  selector:
    matchLabels:
      org: commerce
      class: cart-api
  template:
    metadata:
      labels:
        org: commerce
        class: cart-api
    spec:
      containers:
        - name: cart-api
          image: python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: 80
          volumeMounts:
            - name: application
              mountPath: /app
      volumes:
        - name: application
          configMap:
            name: cart-api-code

---
apiVersion: v1
kind: Service
metadata:
  name: cart-api
  namespace: shopping-cart
spec:
  type: ClusterIP
  selector:
    org: commerce
    class: cart-api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cart-api-access
  namespace: shopping-cart
spec:
  description: "Allow commerce workloads to retrieve carts and add items"
  endpointSelector:
    matchLabels:
      org: commerce
      class: cart-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            org: commerce
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/v1/cart$"
              - method: "POST"
                path: "^/v1/cart/items$"